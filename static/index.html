<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChronosFit</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="hero">
    <div class="clock" aria-live="off">
      <div class="date-line">
        <span id="date"></span>
        <span class="sep">·</span>
        <span id="weekday"></span>
      </div>
      <div class="time" id="time">00:00:00</div>
      <div class="tz-label">Beijing Time (UTC+8)</div>
    </div>
  </header>

  <main class="panel">
    <div class="toolbar">
      <label class="field">
        <span class="field-label">Date</span>
        <div class="date-wrap">
          <input type="date" id="log-date" />
          <button id="today-btn" title="回到今天">Today</button>
        </div>
      </label>
      <label class="field grow">
        <span class="field-label">Plan</span>
        <select id="plan-select"></select>
      </label>
      <button id="fullscreen-btn" title="Toggle fullscreen">⛶ Fullscreen</button>
    </div>

    <div class="dashboard">
      <section class="workout-card">
        <div class="card-head">
          <h1 id="plan-title">—</h1>
          <span class="progress" id="progress">0/0</span>
        </div>
        <ul class="items" id="items"></ul>
        <ul class="items" id="custom-items"></ul>
      </section>

      <aside class="metronome-card" id="metronome">
        <div class="card-head">
          <h1>节拍器</h1>
          <span class="meta" id="metro-status">已停止</span>
        </div>

        <div class="presets" id="metro-presets">
          <button type="button" data-sec="120">2 分钟</button>
          <button type="button" data-sec="300">5 分钟</button>
        </div>

        <div class="count" id="metro-count">02:00</div>

        <div class="custom-dur">
          <input type="number" id="metro-min" min="0" max="180" placeholder="分" />
          <input type="number" id="metro-sec" min="0" max="59" placeholder="秒" />
          <button id="metro-apply" type="button">应用</button>
        </div>

        <button class="metro-toggle" id="metro-toggle" type="button">▶ 开始</button>
        <div class="metro-note">间隔到点会播放提示音</div>
      </aside>
    </div>

    <section class="meals-card">
      <div class="card-head">
        <h1>三餐记录</h1>
        <span class="meta" id="meals-date"></span>
      </div>
      <div class="meals-grid">
        <div class="meals-col" data-meal="breakfast">
          <div class="meal-head">早餐</div>
          <ul class="items"></ul>
        </div>
        <div class="meals-col" data-meal="lunch">
          <div class="meal-head">午餐</div>
          <ul class="items"></ul>
        </div>
        <div class="meals-col" data-meal="dinner">
          <div class="meal-head">晚餐</div>
          <ul class="items"></ul>
        </div>
      </div>
    </section>
  </main>

  <div id="fullscreen-hint">已进入全屏 · 按 <kbd>Esc</kbd> 或 <kbd>F11</kbd> 退出全屏</div>

  <footer class="foot">
    <span id="save-status"></span>
    <a href="/api/export-logs" target="_blank" rel="noopener">Export API</a>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
