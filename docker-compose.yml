services:
  chronosfit:
    build: .
    image: chronosfit:latest
    container_name: chronosfit
    restart: unless-stopped
    ports:
      - "18000:18000"
    volumes:
      # 数据与配置都留在宿主机：删掉容器/镜像都不会丢数据。
      # data/workout.db 与 data/config.yaml 可以直接在宿主机上查看和备份。
      - ./data:/app/data
    extra_hosts:
      # 让容器内可以用 host.docker.internal 访问宿主机上的 MySQL。
      - "host.docker.internal:host-gateway"
    environment:
      CHRONOSFIT_CONFIG: /app/data/config.yaml
      # 下面这些变量留空时不生效，程序回落到 data/config.yaml 的配置；
      # 填了则优先于配置文件。密钥请写在 .env（已 gitignore）里，不要改本文件。
      DATABASE_URL: ${DATABASE_URL:-}
      CHRONOSFIT_API_KEY: ${CHRONOSFIT_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}

  # 可选的 MySQL 服务：默认不启动，用 --profile mysql 显式开启。
  #   docker compose --profile mysql up -d
  # 开启后在 .env 里写 DATABASE_URL=mysql+pymysql://chronosfit:chronosfit@mysql:3306/chronosfit?charset=utf8mb4
  # （或改 data/config.yaml 的 database.url）。
  mysql:
    image: mysql:8.4
    profiles: ["mysql"]
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-chronosfit-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-chronosfit}
      MYSQL_USER: ${MYSQL_USER:-chronosfit}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-chronosfit}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      # 命名卷：MySQL 的数据目录不适合直接挂宿主机目录（权限/符号链接问题），
      # 命名卷同样在 docker compose down 之后保留。
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  mysql-data:
